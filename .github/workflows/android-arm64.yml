name: Build Downhill Revived Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check game core
        run: |
          if [ ! -f build/wasm/dhd_core.wasm ]; then
            echo "::error::dhd_core.wasm belum tersedia."
            echo "APK tidak bisa dibangun tanpa game core."
            exit 1
          fi

      - name: Build Android APK
        run: |
          python port/android/build_apk.py \
            --wasm build/wasm/dhd_core.wasm

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DownhillRevived-Android-ARM64
          path: build/android/*.apk
          if-no-files-found: error
